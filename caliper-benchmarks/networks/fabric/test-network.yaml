name: Caliper Benchmarks
version: "2.0.0"

caliper:
  blockchain: fabric

channels:
  # channelName of mychannel matches the name of the channel created by test network
  - channelName: mychannel
    contracts:
      - id: basic

organizations:
  - mspid: Org1MSP
    # Run ../../update-test-network-config.sh after network.sh up to replace
    # GENERATED_PRIVATE_KEY with the current User1 private key path.
    identities:
      certificates:
        - name: 'User1'
          clientPrivateKey:
            path: '../fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/keystore/GENERATED_PRIVATE_KEY'
          clientSignedCert:
            path: '../fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/signcerts/cert.pem'
    connectionProfile:
      path: '../fabric-samples/test-network/organizations/peerOrganizations/org1.example.com/connection-org1.yaml'
      discover: true
