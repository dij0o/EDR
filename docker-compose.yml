name: edr

# Application Compose boundary: every long-running non-Fabric server service.
# Hyperledger Fabric peers, orderer, CAs, chaincode containers, and generated
# crypto material remain managed by fabric-samples/test-network/network.sh.
# The Expo mobile app is a client/build artifact and is intentionally excluded.
services:
  mysql:
    image: mysql:9.0.1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mydatabase}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - edr-mysql-data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  blockchain-api:
    build:
      context: ./dental-backend
    restart: unless-stopped
    environment:
      PORT: 8081
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      FABRIC_CHANNEL: ${FABRIC_CHANNEL:-mychannel}
      FABRIC_CHAINCODE: ${FABRIC_CHAINCODE:-basic}
      FABRIC_DISCOVERY_ENABLED: ${FABRIC_DISCOVERY_ENABLED:-true}
      FABRIC_DISCOVERY_AS_LOCALHOST: "false"
      FABRIC_CONNECTION_PROFILE_SOURCE: /fabric-connection/connection-org1.json
      FABRIC_CONNECTION_PROFILE: /app/runtime/connection-org1.container.json
      FABRIC_WALLET_PATH: /fabric-wallet
      FABRIC_HOST_GATEWAY: host.docker.internal
      RADIOGRAPHIC_STORAGE_ROOT: /var/lib/edr/radiographic-files
      RADIOGRAPHIC_MAX_FILE_BYTES: ${RADIOGRAPHIC_MAX_FILE_BYTES:-536870912}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "peer0.org1.example.com:host-gateway"
      - "peer0.org2.example.com:host-gateway"
      - "orderer.example.com:host-gateway"
      - "ca.org1.example.com:host-gateway"
    volumes:
      - ${FABRIC_CONNECTION_DIR:-./dental-backend/connection}:/fabric-connection:ro
      - ${FABRIC_WALLET_DIR:-./dental-backend/wallet}:/fabric-wallet:ro
      - edr-radiographic-files:/var/lib/edr/radiographic-files
    ports:
      - "${BLOCKCHAIN_API_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  database-api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      blockchain-api:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-mydatabase}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:-}
      BLOCKCHAIN_API_URL: http://blockchain-api:8081
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "${DATABASE_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web-frontend:
    build:
      context: ./bc-dentistry-frontend
      args:
        VITE_DATABASE_API_URL: /api/database
        VITE_BLOCKCHAIN_API_URL: /api/blockchain
    restart: unless-stopped
    depends_on:
      database-api:
        condition: service_healthy
      blockchain-api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  edr-mysql-data:
  edr-radiographic-files:
